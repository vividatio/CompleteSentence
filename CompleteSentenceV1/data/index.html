<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Slider und Netzwerk-Einstellungen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>RGB Farb-Slider und Netzwerk-Einstellungen</h1>

    <div class="input-container">
        <label for="ssid">SSID:</label>
        <input type="text" id="ssid" placeholder="Enter SSID">
    </div>
    <div class="input-container">
        <label for="password">Passwort:</label>
        <input type="password" id="password" placeholder="Enter Passwort">
    </div>

    <div class="slider-container">
        <label for="red">Rot: <span id="redValue">128</span></label>
        <input type="range" id="red" min="0" max="255" value="128" oninput="updateColor()">
    </div>
    <div class="slider-container">
        <label for="green">Grün: <span id="greenValue">128</span></label>
        <input type="range" id="green" min="0" max="255" value="128" oninput="updateColor()">
    </div>
    <div class="slider-container">
        <label for="blue">Blau: <span id="blueValue">128</span></label>
        <input type="range" id="blue" min="0" max="255" value="128" oninput="updateColor()">
    </div>
    <div class="color-box" id="colorBox"></div>

    <script>
        function updateColor() {
            const red = document.getElementById('red').value;
            const green = document.getElementById('green').value;
            const blue = document.getElementById('blue').value;

            document.getElementById('redValue').innerText = red;
            document.getElementById('greenValue').innerText = green;
            document.getElementById('blueValue').innerText = blue;

            const rgbColor = `rgb(${red}, ${green}, ${blue})`;
            document.getElementById('colorBox').style.backgroundColor = rgbColor;
        }

        // Initiales Update der Farbe
        updateColor();
    </script>
</body>
</html>
