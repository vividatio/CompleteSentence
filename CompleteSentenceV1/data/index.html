<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordClock Einstellungen</title>
    
    <!-- CSS richtig verlinken -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Background festlegen -->
    <div class="background-container">
        <!-- nothing to show now -->

        <hr>

        <div class="website_title">
            <h1> WordClock Einstellungen</h1>
        </div>

        <hr>

        <!-- WiFi-Einstellungen -->
        <div class="wifi-section">
            <h2>WiFi-Einstellungen</h2>
            <div class="input-group">
                <label for="ssid">SSID:</label>
                <input type="text" id="ssid" name="ssid" onchange="send_ssid()">
            </div>
            
            <div class="input-group">
                <label for="password">Passwort:</label>
                <input type="password" id="password" name="password" onchange="send_password()">
            </div>

            <!-- Reconnect Button -->
            <div class="recon-btn">
                <button id="reconnect-btn" onclick="reconnectWiFi()">Reconnect</button>
            </div>
        </div>

        <!-- Optische Trennung -->
        <hr>

        <!-- RGB-Einstellungen -->
        <div class="rgb-section">
            <h2>RGB-Controller</h2>

            <!-- Rot-Slider -->
            <label for="r-slider">Rot (R): <span id="r-value">1</span></label>
            <input type="range" id="r-slider" min="1" max="255" value="0">
            <br>
            
            <!-- Grün-Slider -->
            <label for="g-slider">Grün (G): <span id="g-value">1</span></label>
            <input type="range" id="g-slider" min="1" max="255" value="0">
            <br>

            <!-- Blau-Slider -->
            <label for="b-slider">Blau (B): <span id="b-value">1</span></label>
            <input type="range" id="b-slider" min="1" max="255" value="0">
            <br>

            <!-- Farbe-Vorschau ohne Helligkeit -->
            <div>
                <h3>Farben Vorschau</h3>
                <div id="color-preview"></div>
            </div>
             <!-- Reconnect Button -->
             <div class="color-save-btn">
                <button id="color-save-btn" onclick="saveColor()">save color</button>
            </div>
        </div>
        
        <!-- Optische Trennung -->
        <hr>
        
        <div class="h-section">
            <h2>Helligkeit-Controller</h2>
            <!-- Helligkeit-Slider -->
            <label for="brightness-slider">Helligkeit: <span id="brightness-value">1</span></label>
            <input type="range" id="brightness-slider" min="1" max="255" value="0">
            <br>

            <!-- Vorschau mit Helligkeit -->
            <div>
                <h3>Helligkeit Vorschau</h3>
                <div id="brightness-preview"></div>
            </div>

            <div class="color-save-btn">
                <button id="color-save-btn" onclick="saveColor()">save brightnes</button>
            </div>

        </div>

        <hr>

        <div class="mode-section">

            <button id="change-mode" onclick="changeMode()">Change Mode</button>
        
        </div>


        <!-- JavaScript richtig verlinken -->
        <script src="assets/js/script.js"></script>

    </div>
</body>

</html>
